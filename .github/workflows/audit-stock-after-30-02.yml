name: Audit Stock After 30-02
on: workflow_dispatch
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 172.233.89.171
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            export PATH=$PATH:/root/.nvm/versions/node/$(ls /root/.nvm/versions/node/ 2>/dev/null | tail -1)/bin:/usr/local/bin
            cd /var/www/nenova-erp
            git fetch origin codex/stock-target-repair
            git show origin/codex/stock-target-repair:scripts/audit-stock-all-weeks.mjs > /tmp/audit-stock-all-weeks.mjs
            node --env-file=.env.local /tmp/audit-stock-all-weeks.mjs --year=2026
