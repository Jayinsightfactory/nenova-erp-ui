name: Read-only packing diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package file-only diagnostics
        id: script
        shell: bash
        run: |
          {
            echo 'script<<PACKING_DIAG_EOF'
            printf "node <<'PACKING_READONLY'\n"
            cat scripts/diagnose-packing-readonly.cjs
            printf "\nPACKING_READONLY\n"
            echo 'PACKING_DIAG_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 172.233.89.171
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: ${{ steps.script.outputs.script }}
