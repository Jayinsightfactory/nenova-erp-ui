name: Read-only production profit print
on:
  workflow_dispatch:
    inputs:
      year:
        description: Report year
        default: '2026'
        required: true
      weeks:
        description: Selected weeks (1 or 3 weeks)
        default: '18,38,39'
        required: true
permissions:
  contents: read
jobs:
  print:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify selected print pages without business writes
        env:
          NENOVAWEB_SERVICE_TOKEN: ${{ secrets.NENOVAWEB_SERVICE_TOKEN }}
          PROBE_YEAR: ${{ inputs.year }}
          PROBE_WEEKS: ${{ inputs.weeks }}
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/profit-production-print-smoke.cjs
