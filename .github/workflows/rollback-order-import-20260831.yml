name: Rollback 2026-08-31 Wrong Order Import

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run은 조회만, apply는 41건 원복"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply
      confirmation:
        description: "apply일 때 ROLLBACK_2026_36_01_41 입력"
        required: false
        type: string

concurrency:
  group: nenova-order-import-rollback-20260831
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        shell: bash
        run: |
          if [ "${{ inputs.mode }}" = "apply" ] && [ "${{ inputs.confirmation }}" != "ROLLBACK_2026_36_01_41" ]; then
            echo "apply confirmation mismatch"
            exit 1
          fi

      - name: Run read-only preflight or approved rollback on Cafe24
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 172.233.89.171
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            export PATH=$PATH:/root/.nvm/versions/node/$(ls /root/.nvm/versions/node/ 2>/dev/null | tail -1)/bin:/usr/local/bin
            cd /var/www/nenova-erp
            git fetch origin master
            git reset --hard origin/master
            if [ "${{ inputs.mode }}" = "apply" ]; then
              node --env-file=.env.local scripts/rollback-order-import-20260831.mjs --apply
            else
              node --env-file=.env.local scripts/rollback-order-import-20260831.mjs
            fi
