name: Recompute Work-Drive Invoice Pairs

# 수동 실행 전용 — 업무 드라이브 기존 파일로 인보이스 PDF ↔ 결과 엑셀 짝 일괄 재계산(data/drive/pairs.json).
# 읽기+웹 전용 파일 쓰기만(MSSQL 무관). gh workflow run drive-pairs-recompute.yml
on:
  workflow_dispatch:

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - name: SSH recompute pairs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 172.233.89.171
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            set -e
            cd /var/www/nenova-erp
            git log --oneline -1
            ls -la data/drive/index.jsonl 2>/dev/null || echo "index.jsonl 없음"
            node scripts/work-drive-pairs-recompute.mjs
