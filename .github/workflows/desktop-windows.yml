name: Nenova Desktop Windows

on:
  workflow_dispatch:
  pull_request:
    paths: ['desktop/**', 'components/Layout.js', 'pages/api/desktop/**', 'lib/desktopBootstrap.js', '__tests__/desktopBootstrap.test.mjs', '.github/workflows/desktop-windows.yml']
  push:
    branches: [master]
    paths: ['desktop/**', 'components/Layout.js', 'pages/api/desktop/**', 'lib/desktopBootstrap.js', '__tests__/desktopBootstrap.test.mjs', '.github/workflows/desktop-windows.yml']

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run menu
      - run: npm test
      - name: Isolated Electron lifecycle and authentication smoke
        run: npm run test:smoke
      - name: Restore in a separate process
        run: npm run test:restore
      - name: Update download integrity (no installer execution)
        run: npm run test:updater
      - name: Build Windows installer
        run: npm run dist
      - name: Installer SHA256
        run: Get-FileHash dist/Nenova-Desktop-Setup-*-x64.exe -Algorithm SHA256 | Format-List | Out-File dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Nenova-Desktop-Windows-x64
          path: |
            desktop/dist/Nenova-Desktop-Setup-*-x64.exe
            desktop/dist/SHA256.txt
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          retention-days: 30
