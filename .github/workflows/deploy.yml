name: Deploy to Cafe24

on:
  workflow_dispatch:
    inputs:
      diagnose_checkout_only:
        description: '읽기 전용: 서버 Git 변경 파일명/통계만 확인, 배포·DB·서비스 변경 없음'
        type: boolean
        required: false
        default: false
      migrate_order_mappings:
        description: '승인된 업체·품목 매칭 파일의 공유 DB 최초 이전'
        type: boolean
        required: false
        default: false
      apply_db_migrations:
        description: '별도 승인된 DB 스키마 적용 (기본: 웹 코드만 배포)'
        type: boolean
        required: false
        default: false
  push:
    branches: [master]

concurrency:
  group: nenova-cafe24-production
  cancel-in-progress: false

jobs:
  diagnose-checkout:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_checkout_only == true
    runs-on: ubuntu-latest
    steps:
      - name: Read-only server checkout diagnosis
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 172.233.89.171
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            cd /var/www/nenova-erp || exit 1
            export GIT_OPTIONAL_LOCKS=0
            git rev-parse HEAD
            git status --short --untracked-files=no
            git diff --numstat
            git diff --cached --numstat
  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.diagnose_checkout_only != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (hydration 스모크 스크립트용)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (ERP 계약검사용)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: ERP 계약 + 교차연도 쓰기 검증
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          BASE_SHA="${BASE_SHA:-$(git rev-parse "${GITHUB_SHA}^")}"
          npm ci
          node --test __tests__/codeOnlyDeployment.test.cjs
          npm run test:erp-contract
          npm run test:erp-manifest -- --changed-from "$BASE_SHA"
          npm run guard:erp-writes -- --changed-from "$BASE_SHA"

      - name: SSH Deploy to Cafe24
        uses: appleboy/ssh-action@v1.0.3
        env:
          APPLY_DB_MIGRATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_db_migrations == true && 'true' || 'false' }}
          MIGRATE_ORDER_MAPPINGS: ${{ github.event_name == 'workflow_dispatch' && inputs.migrate_order_mappings == true && 'true' || 'false' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NENOVA_ESTIMATE_SEAL_PNG: ${{ secrets.NENOVA_ESTIMATE_SEAL_PNG }}
          WEEKDAY_TEMPLATE_KEY: ${{ secrets.WEEKDAY_TEMPLATE_KEY }}
          PUBLIC_API_KEY: ${{ secrets.PUBLIC_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTOMATION_API_TOKEN: ${{ secrets.AUTOMATION_API_TOKEN }}
          MOYI_API_TOKEN: ${{ secrets.MOYI_API_TOKEN }}
          MOYI_BRIDGE_TOKEN: ${{ secrets.MOYI_BRIDGE_TOKEN }}
          ECOUNT_INGEST_TOKEN: ${{ secrets.ECOUNT_INGEST_TOKEN }}
          ORBIT_DRIVE_INGEST_TOKEN: ${{ secrets.ORBIT_DRIVE_INGEST_TOKEN }}
          ORBIT_OWNER_TOKEN: ${{ secrets.ORBIT_OWNER_TOKEN }}
          NENOVAWEB_SERVICE_TOKEN: ${{ secrets.NENOVAWEB_SERVICE_TOKEN }}
          BAROBILL_ENV: ${{ secrets.BAROBILL_ENV }}
          BAROBILL_CERTKEY: ${{ secrets.BAROBILL_CERTKEY }}
          BAROBILL_CORPNUM: ${{ secrets.BAROBILL_CORPNUM }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          KAKAO_SHEET_ID: ${{ secrets.KAKAO_SHEET_ID }}
          NENOVA_SALES_READ_TOKEN: ${{ secrets.NENOVA_SALES_READ_TOKEN }}
          NENOVA_SALES_ROOM_ID: ${{ secrets.NENOVA_SALES_ROOM_ID }}
        with:
          host: 172.233.89.171
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          envs: APPLY_DB_MIGRATIONS,MIGRATE_ORDER_MAPPINGS,JWT_SECRET,NENOVA_ESTIMATE_SEAL_PNG,WEEKDAY_TEMPLATE_KEY,PUBLIC_API_KEY,ANTHROPIC_API_KEY,AUTOMATION_API_TOKEN,MOYI_API_TOKEN,MOYI_BRIDGE_TOKEN,ECOUNT_INGEST_TOKEN,ORBIT_DRIVE_INGEST_TOKEN,ORBIT_OWNER_TOKEN,NENOVAWEB_SERVICE_TOKEN,BAROBILL_ENV,BAROBILL_CERTKEY,BAROBILL_CORPNUM,GOOGLE_SERVICE_ACCOUNT_JSON,KAKAO_SHEET_ID,NENOVA_SALES_READ_TOKEN,NENOVA_SALES_ROOM_ID
          # Tests plus webpack can exceed ssh-action's default ten minutes.
          # Keep code-only migration gates and atomic build swap unchanged.
          command_timeout: 30m
          script: |
            export PATH=$PATH:/root/.nvm/versions/node/$(ls /root/.nvm/versions/node/ 2>/dev/null | tail -1)/bin:/usr/local/bin
            cd /var/www/nenova-erp
            echo "=== git pull ==="
            git remote set-url origin https://github.com/Jayinsightfactory/nenova-erp-ui.git
            git fetch origin master
            # Preserve existing user mappings before reset replaces the tracked seed.
            # copyFileSync(COPYFILE_EXCL) never overwrites a migrated runtime store.
            if [ ! -f .next/.mapping-db-capable ]; then
              node -e 'const fs=require("fs"); const src="data/order-mappings.json", dst="data/order-mappings.runtime.json"; if(fs.existsSync(src)&&!fs.existsSync(dst)){const value=JSON.parse(fs.readFileSync(src,"utf8")); if(!value||Array.isArray(value)||typeof value!=="object")throw Error("Invalid mapping store"); fs.copyFileSync(src,dst,fs.constants.COPYFILE_EXCL);}' || exit 1
            fi
            # BEGIN PRESERVE_BUILD_OUTPUTS
            # Previous builds regenerate these tracked files. Preserve exact copies and
            # a binary patch before restoring only this allowlist; never touch other edits.
            if ! git diff --cached --quiet; then
              echo "DEPLOY_STAGED_CHANGES: preserving server edits; stopped"
              exit 1
            fi
            mapfile -t changed_outputs < <(git diff --name-only)
            build_outputs=()
            for changed in "${changed_outputs[@]}"; do
              case "$changed" in
                data/generated/full-development-history.json|data/generated/menu-development-history.json|package-lock.json) build_outputs+=("$changed") ;;
                data/order-import-units.json)
                  # Live learned units are NOT generated output. Never restore them.
                  # Only allow an ff update that leaves this tracked path untouched.
                  git diff --quiet HEAD origin/master -- "$changed" || { echo 'DEPLOY_RUNTIME_UPSTREAM_CONFLICT: learned units require reconciliation'; exit 1; }
                  node -e 'const fs=require("fs");const v=JSON.parse(fs.readFileSync("data/order-import-units.json","utf8"));if(!v||Array.isArray(v)||typeof v!=="object")process.exit(1);' || exit 1
                  ;;
                *) printf 'DEPLOY_CHECKOUT_DIRTY: unrecognized tracked change: %s; stopped\n' "$changed"; exit 1 ;;
              esac
            done
            if [ "${#changed_outputs[@]}" -gt 0 ]; then
              backup_root="${NENOVA_DEPLOY_BACKUP_ROOT:-/var/lib/nenova/deploy-backups}"
              backup_dir="$backup_root/$(date -u +%Y%m%dT%H%M%S)-$(git rev-parse --short HEAD)-$$"
              mkdir -p "$backup_dir" || exit 1
              chmod 700 "$backup_dir" || exit 1
              cp --parents -- "${changed_outputs[@]}" "$backup_dir/" || exit 1
              git diff --binary -- "${changed_outputs[@]}" > "$backup_dir/tracked-build-output.patch" || exit 1
              if [ "${#build_outputs[@]}" -gt 0 ]; then
                git restore --source=HEAD --worktree -- "${build_outputs[@]}" || exit 1
              fi
              echo "BUILD_OUTPUTS_BACKED_UP: $backup_dir"
            fi
            # END PRESERVE_BUILD_OUTPUTS
            # Never discard any remaining edits or force a diverged checkout.
            if ! git diff --quiet -- . ':!data/order-import-units.json' || ! git diff --cached --quiet; then
              echo "DEPLOY_CHECKOUT_DIRTY: 서버 변경을 보존하고 배포 중단"
              git status --short
              exit 1
            fi
            git merge --ff-only origin/master || exit 1
            # Audit events survive source resets/build swaps and are never release artifacts.
            export NENOVA_ACTIVITY_DIR=/var/lib/nenova/user-activity
            mkdir -p "$NENOVA_ACTIVITY_DIR"
            test -w "$NENOVA_ACTIVITY_DIR" || exit 1
            export NENOVA_STOCK_RECOVERY_DIR=/var/lib/nenova/stock-recovery
            export NENOVA_PENDING_STOCK_RECOVERY=1
            mkdir -p "$NENOVA_STOCK_RECOVERY_DIR"
            test -w "$NENOVA_STOCK_RECOVERY_DIR" || exit 1
            node scripts/install-weekday-template.cjs || exit 1
            unset WEEKDAY_TEMPLATE_KEY
            # The still-running previous build writes the old filename until reload.
            # Keep that filename pointing at the same persistent store during the build.
            if [ ! -f .next/.mapping-db-capable ]; then
              node -e 'const fs=require("fs"); const dst="data/order-mappings.runtime.json", old="data/order-mappings.json"; if(fs.existsSync(dst)){JSON.parse(fs.readFileSync(dst,"utf8")); if(fs.existsSync(old))fs.unlinkSync(old); fs.symlinkSync("order-mappings.runtime.json",old);}' || exit 1
            fi
            # App allows 30MiB; only this exact route receives multipart overhead allowance.
            # Helper preserves upstream/auth directives and validates/rolls back nginx config.
            node scripts/ensure-pnl-upload-nginx.mjs --apply || exit 1
            echo "=== .env.local 환경변수 동기화 (JWT_SECRET) ==="
            if [ -n "$JWT_SECRET" ]; then
              if grep -q '^JWT_SECRET=' .env.local 2>/dev/null; then
                grep -v '^JWT_SECRET=' .env.local > .env.local.tmp || true
                mv .env.local.tmp .env.local
              fi
              echo "JWT_SECRET=$JWT_SECRET" >> .env.local
              echo "✅ JWT_SECRET synced (len=${#JWT_SECRET})"
            elif ! grep -q '^JWT_SECRET=' .env.local 2>/dev/null; then
              echo "❌ JWT_SECRET 필요 — GitHub Secret 또는 서버 .env.local 에 설정"
              exit 1
            else
              JWT_SECRET="$(grep '^JWT_SECRET=' .env.local | tail -1 | cut -d= -f2-)"
              export JWT_SECRET
              echo "✅ JWT_SECRET already present on server"
            fi
            echo "=== .env.local 환경변수 동기화 (PUBLIC_API_KEY) ==="
            if [ -n "$PUBLIC_API_KEY" ]; then
              if grep -q '^PUBLIC_API_KEY=' .env.local 2>/dev/null; then
                grep -v '^PUBLIC_API_KEY=' .env.local > .env.local.tmp || true
                mv .env.local.tmp .env.local
              fi
              echo "PUBLIC_API_KEY=$PUBLIC_API_KEY" >> .env.local
              echo "✅ PUBLIC_API_KEY synced (len=${#PUBLIC_API_KEY})"
            elif ! grep -q '^PUBLIC_API_KEY=' .env.local 2>/dev/null; then
              echo "❌ PUBLIC_API_KEY 필요 — public API smoke 와 외부 연동 보호용"
              exit 1
            else
              echo "✅ PUBLIC_API_KEY already present on server"
            fi
            echo "=== .env.local 환경변수 동기화 (ANTHROPIC_API_KEY) ==="
            if [ -n "$ANTHROPIC_API_KEY" ]; then
              if grep -q '^ANTHROPIC_API_KEY=' .env.local 2>/dev/null; then
                # BSD/GNU sed 호환: 임시 파일 방식
                grep -v '^ANTHROPIC_API_KEY=' .env.local > .env.local.tmp || true
                mv .env.local.tmp .env.local
              fi
              echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" >> .env.local
              echo "✅ ANTHROPIC_API_KEY synced (len=${#ANTHROPIC_API_KEY})"
            else
              echo "⚠️  ANTHROPIC_API_KEY GitHub Secret 이 비어있음 — 챗봇 LLM 비활성"
            fi
            echo "=== .env.local 환경변수 동기화 (AUTOMATION_API_TOKEN) ==="
            if [ -n "$AUTOMATION_API_TOKEN" ]; then
              if grep -q '^AUTOMATION_API_TOKEN=' .env.local 2>/dev/null; then
                grep -v '^AUTOMATION_API_TOKEN=' .env.local > .env.local.tmp || true
                mv .env.local.tmp .env.local
              fi
              echo "AUTOMATION_API_TOKEN=$AUTOMATION_API_TOKEN" >> .env.local
              echo "✅ AUTOMATION_API_TOKEN synced (len=${#AUTOMATION_API_TOKEN})"
            fi
            echo "=== .env.local 환경변수 동기화 (ECOUNT_INGEST_TOKEN) ==="
            if [ -n "$ECOUNT_INGEST_TOKEN" ]; then
              if grep -q '^ECOUNT_INGEST_TOKEN=' .env.local 2>/dev/null; then
                grep -v '^ECOUNT_INGEST_TOKEN=' .env.local > .env.local.tmp || true
                mv .env.local.tmp .env.local
              fi
              echo "ECOUNT_INGEST_TOKEN=$ECOUNT_INGEST_TOKEN" >> .env.local
              echo "✅ ECOUNT_INGEST_TOKEN synced (len=${#ECOUNT_INGEST_TOKEN})"
            fi
            echo "=== .env.local 환경변수 동기화 (NENOVAWEB_SERVICE_TOKEN — MOYI FDE 사장님 대행 서비스 토큰) ==="
            if [ -n "$NENOVAWEB_SERVICE_TOKEN" ]; then
              if grep -q '^NENOVAWEB_SERVICE_TOKEN=' .env.local 2>/dev/null; then
                grep -v '^NENOVAWEB_SERVICE_TOKEN=' .env.local > .env.local.tmp || true
                mv .env.local.tmp .env.local
              fi
              echo "NENOVAWEB_SERVICE_TOKEN=$NENOVAWEB_SERVICE_TOKEN" >> .env.local
              echo "✅ NENOVAWEB_SERVICE_TOKEN synced (len=${#NENOVAWEB_SERVICE_TOKEN})"
            fi
            echo "=== .env.local 환경변수 동기화 (BAROBILL_ENV — 바로빌 환경 test|prod) ==="
            if [ -n "$BAROBILL_ENV" ]; then
              if grep -q '^BAROBILL_ENV=' .env.local 2>/dev/null; then
                grep -v '^BAROBILL_ENV=' .env.local > .env.local.tmp || true
                mv .env.local.tmp .env.local
              fi
              echo "BAROBILL_ENV=$BAROBILL_ENV" >> .env.local
              echo "✅ BAROBILL_ENV synced (len=${#BAROBILL_ENV})"
            fi
            echo "=== .env.local 환경변수 동기화 (BAROBILL_CERTKEY — 바로빌 연동인증키) ==="
            if [ -n "$BAROBILL_CERTKEY" ]; then
              if grep -q '^BAROBILL_CERTKEY=' .env.local 2>/dev/null; then
                grep -v '^BAROBILL_CERTKEY=' .env.local > .env.local.tmp || true
                mv .env.local.tmp .env.local
              fi
              echo "BAROBILL_CERTKEY=$BAROBILL_CERTKEY" >> .env.local
              echo "✅ BAROBILL_CERTKEY synced (len=${#BAROBILL_CERTKEY})"
            fi
            echo "=== .env.local 환경변수 동기화 (BAROBILL_CORPNUM — 바로빌 회원사 사업자번호) ==="
            if [ -n "$BAROBILL_CORPNUM" ]; then
              if grep -q '^BAROBILL_CORPNUM=' .env.local 2>/dev/null; then
                grep -v '^BAROBILL_CORPNUM=' .env.local > .env.local.tmp || true
                mv .env.local.tmp .env.local
              fi
              echo "BAROBILL_CORPNUM=$BAROBILL_CORPNUM" >> .env.local
              echo "✅ BAROBILL_CORPNUM synced (len=${#BAROBILL_CORPNUM})"
            fi
            echo "=== .env.local 환경변수 동기화 (ORBIT_DRIVE_INGEST_TOKEN — 업무 드라이브 데몬 업로드) ==="
            if [ -n "$ORBIT_DRIVE_INGEST_TOKEN" ]; then
              if grep -q '^ORBIT_DRIVE_INGEST_TOKEN=' .env.local 2>/dev/null; then
                grep -v '^ORBIT_DRIVE_INGEST_TOKEN=' .env.local > .env.local.tmp || true
                mv .env.local.tmp .env.local
              fi
              echo "ORBIT_DRIVE_INGEST_TOKEN=$ORBIT_DRIVE_INGEST_TOKEN" >> .env.local
              echo "✅ ORBIT_DRIVE_INGEST_TOKEN synced (len=${#ORBIT_DRIVE_INGEST_TOKEN})"
            fi
            echo "=== .env.local 환경변수 동기화 (ORBIT_OWNER_TOKEN — /my-work 캡처 화면 조회) ==="
            if [ -n "$ORBIT_OWNER_TOKEN" ]; then
              if grep -q '^ORBIT_OWNER_TOKEN=' .env.local 2>/dev/null; then
                grep -v '^ORBIT_OWNER_TOKEN=' .env.local > .env.local.tmp || true
                mv .env.local.tmp .env.local
              fi
              echo "ORBIT_OWNER_TOKEN=$ORBIT_OWNER_TOKEN" >> .env.local
              echo "✅ ORBIT_OWNER_TOKEN synced (len=${#ORBIT_OWNER_TOKEN})"
            fi
            if [ -z "$AUTOMATION_API_TOKEN" ]; then
              echo "ℹ️  AUTOMATION_API_TOKEN GitHub Secret 미설정 — n8n 브리지 API 비활성(503)"
            fi
            echo "=== .env.local 환경변수 동기화 (MOYI_API_TOKEN) ==="
            if [ -n "$MOYI_API_TOKEN" ]; then
              if grep -q '^MOYI_API_TOKEN=' .env.local 2>/dev/null; then
                grep -v '^MOYI_API_TOKEN=' .env.local > .env.local.tmp || true
                mv .env.local.tmp .env.local
              fi
              echo "MOYI_API_TOKEN=$MOYI_API_TOKEN" >> .env.local
              echo "✅ MOYI_API_TOKEN synced (len=${#MOYI_API_TOKEN})"
            else
              echo "ℹ️  MOYI_API_TOKEN GitHub Secret 미설정 — AUTOMATION_API_TOKEN 폴백 사용"
            fi
            echo "=== .env.local 환경변수 동기화 (MOYI_BRIDGE_TOKEN) ==="
            if [ -n "$MOYI_BRIDGE_TOKEN" ]; then
              if grep -q '^MOYI_BRIDGE_TOKEN=' .env.local 2>/dev/null; then
                grep -v '^MOYI_BRIDGE_TOKEN=' .env.local > .env.local.tmp || true
                mv .env.local.tmp .env.local
              fi
              echo "MOYI_BRIDGE_TOKEN=$MOYI_BRIDGE_TOKEN" >> .env.local
              echo "✅ MOYI_BRIDGE_TOKEN synced (len=${#MOYI_BRIDGE_TOKEN})"
            else
              echo "ℹ️  MOYI_BRIDGE_TOKEN GitHub Secret 미설정 — MOYI 드라이브 동기화 비활성"
            fi
            echo "=== .env.local 환경변수 동기화 (GOOGLE_SERVICE_ACCOUNT_JSON) ==="
            if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
              if grep -q '^GOOGLE_SERVICE_ACCOUNT_JSON=' .env.local 2>/dev/null; then
                grep -v '^GOOGLE_SERVICE_ACCOUNT_JSON=' .env.local > .env.local.tmp || true
                mv .env.local.tmp .env.local
              fi
              echo "GOOGLE_SERVICE_ACCOUNT_JSON=$GOOGLE_SERVICE_ACCOUNT_JSON" >> .env.local
              echo "✅ GOOGLE_SERVICE_ACCOUNT_JSON synced (len=${#GOOGLE_SERVICE_ACCOUNT_JSON})"
            else
              echo "ℹ️  GOOGLE_SERVICE_ACCOUNT_JSON GitHub Secret 미설정 — 카카오 시트 연동 비활성"
            fi
            echo "=== .env.local 환경변수 동기화 (KAKAO_SHEET_ID) ==="
            if [ -n "$KAKAO_SHEET_ID" ]; then
              if grep -q '^KAKAO_SHEET_ID=' .env.local 2>/dev/null; then
                grep -v '^KAKAO_SHEET_ID=' .env.local > .env.local.tmp || true
                mv .env.local.tmp .env.local
              fi
              echo "KAKAO_SHEET_ID=$KAKAO_SHEET_ID" >> .env.local
              echo "✅ KAKAO_SHEET_ID synced"
            else
              echo "ℹ️  KAKAO_SHEET_ID 미설정 — 기본 시트ID 사용"
            fi
            # Dedicated read-only feed credentials: never print their values.
            for KEY in NENOVA_SALES_READ_TOKEN NENOVA_SALES_ROOM_ID NENOVA_ESTIMATE_SEAL_PNG; do
              VALUE="$(printenv "$KEY")"
              if [ -n "$VALUE" ]; then
                grep -v "^${KEY}=" .env.local > .env.local.tmp || true
                mv .env.local.tmp .env.local
                printf '%s=%s\n' "$KEY" "$VALUE" >> .env.local
              fi
            done
            unset VALUE
            echo "=== npm install ==="
            mkdir -p public/uploads/catalog/_bulk_import data
            if [ -f public/uploads/catalog/_bulk_import/*통합본*.pptx ] 2>/dev/null || ls public/uploads/catalog/_bulk_import/*통합본*.pptx 1>/dev/null 2>&1; then
              echo "✅ 카달로그 통합본 PPTX — 서버에 있음 (카탈로그 진입 시 자동 등록)"
            else
              echo "ℹ️  통합본 PPTX 없음 — public/uploads/catalog/_bulk_import/ 에 카달로그_통합본.pptx 1회 업로드"
            fi
            npm install --omit=dev
            # BEGIN EXPLICIT_DB_MIGRATIONS: push/default dispatch is code-only.
            if [ "${APPLY_DB_MIGRATIONS:-false}" = "true" ]; then
            echo "=== 주차별 매출이익 근거 스키마 적용 ==="
            node scripts/apply-profit-report-evidence-migrations.mjs --apply
            echo "=== 웹·전산 동시수정 보호 스키마 적용 ==="
            node scripts/apply-erp-edit-presence-migration.mjs --apply
            echo "=== 선출고 관리 웹 스키마 적용 ==="
            node scripts/apply-pre-shipment-migration.mjs --apply
            echo "=== 자동 중국물량표 웹 스키마 적용 ==="
            node scripts/apply-china-volume-board-migration.mjs --apply
            node scripts/apply-farm-quality-migration.mjs --apply || exit 1
            echo "=== 호텔 결산 탭 등록부 스키마 적용 ==="
            node scripts/apply-pnl-hotels-migration.mjs --apply || exit 1
            node scripts/apply-pnl-hotel-customer-map-migration.mjs --apply || exit 1
            echo "=== 호텔 결산 특이사항 스키마 적용 ==="
            node scripts/apply-pnl-special-notes-migration.mjs --apply || exit 1
            echo "=== 매출원가 원천시트 스냅샷 스키마 적용 ==="
            node scripts/apply-profit-workbook-snapshot-migration.mjs --apply || exit 1
            echo "=== 매출이익 보고서 계산 스냅샷·확정 스키마 적용 ==="
            node scripts/apply-profit-report-snapshot-migration.mjs --apply || exit 1
            echo "=== 엑셀 출고분배 전체 되돌리기 스키마 적용 ==="
            node scripts/apply-shipment-import-snapshot-migration.mjs --apply
            # User approved only these two web audit tables on 2026-10-01.
            node scripts/apply-weekday-distribution-migration.mjs --apply || exit 1
            node scripts/apply-weekday-early-shipment-migration.mjs --apply || exit 1
            else
              echo "CODE_ONLY_DEPLOY: all DB migrations skipped; no SQL repair or recalculation."
            fi
            # END EXPLICIT_DB_MIGRATIONS
            echo "=== build ==="
            rm -rf .next-build
            # Build workers must not connect to SQL or start DB-backed schedulers.
            # Inline environment is build-only; the running app keeps its existing DB configuration.
            # Bound only the build process heap; do not change the running ERP process.
            # Unbounded webpack was killed twice before the atomic swap (2026-10-26).
            free -m || true
            if ! DB_SERVER='' NEXT_DIST_DIR=.next-build NODE_OPTIONS='--max-old-space-size=1536' npm run build 2>&1; then echo "❌ 빌드 실패 — 운영 산출물/pm2 보존"; pm2 logs nenova-erp --nostream --lines 5 2>&1; exit 1; fi
            if [ ! -d ".next-build/server" ]; then echo "❌ .next-build/server 누락 — 운영 산출물 보존"; exit 1; fi
            # BEGIN ORDER_MAPPING_CUTOVER: explicit first migration only, after successful build.
            if ! node scripts/migrate-order-mappings.mjs --check-ready; then
              if [ "${MIGRATE_ORDER_MAPPINGS:-false}" != "true" ]; then
                echo "MAPPING_DB_NOT_READY: 기존 앱 유지. 승인된 migrate_order_mappings=true dispatch 필요."
                exit 1
              fi
              # Prove SQL connectivity and clean migration state before any interruption.
              node scripts/migrate-order-mappings.mjs --check-unmigrated || exit 1
              # A completed save has synchronously persisted before its HTTP response.
              # Stop every old web instance before taking the final file snapshot.
              # Requests still in flight may fail and must be checked by their caller.
              pm2 stop nenova-erp --kill-timeout 30000 || exit 1
              if ! node scripts/assert-mapping-writers-stopped.cjs; then
                echo "❌ 매칭 작성자 중지 확인 실패 — 이전 중단"
                exit 1
              fi
              mkdir -p /var/backups/nenova-mappings
              chmod 700 /var/backups/nenova-mappings
              MAPPING_BACKUP_DIR="/var/backups/nenova-mappings/$(date -u +%Y%m%dT%H%M%S)-$$"
              MAPPING_SCOPE_ARGS=()
              if [ -f data/order-import-customer-product-mappings.runtime.json ]; then
                MAPPING_SCOPE_ARGS=(--customer-product-file data/order-import-customer-product-mappings.runtime.json)
              fi
              if ! node scripts/migrate-order-mappings.mjs --apply --writers-stopped \
                --customer-file data/customer-mappings.json \
                --product-file data/order-mappings.runtime.json \
                "${MAPPING_SCOPE_ARGS[@]}" --backup-dir "$MAPPING_BACKUP_DIR"; then
                # Unknown commit outcome must never restart a file-only application.
                if node scripts/migrate-order-mappings.mjs --check-unmigrated; then
                  pm2 restart nenova-erp --update-env
                fi
                echo "❌ 매칭 DB 이전 실패 — 원본 백업과 DB 상태 확인 필요"
                exit 1
              fi
            fi
            # END ORDER_MAPPING_CUTOVER
            touch .next-build/.mapping-db-capable
            echo "=== atomic build swap + pm2 reload ==="
            rm -rf .next-previous
            if [ -d .next ]; then mv .next .next-previous; fi
            mv .next-build .next
            if ! pm2 reload nenova-erp --update-env; then
              if [ ! -f .next-previous/.mapping-db-capable ]; then
                echo "❌ 시작 실패 — DB 이전 후 파일 기반 구버전 복귀 금지. 새 빌드를 유지합니다."
                exit 1
              fi
              rm -rf .next
              if [ -d .next-previous ]; then mv .next-previous .next; fi
              pm2 restart nenova-erp
              echo "❌ reload 실패 — 이전 산출물로 롤백"
              exit 1
            fi
            echo "=== pm2 워밍업 대기 (Next 초기화 — 스모크 오탐 방지) ==="
            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:3000/api/ping >/dev/null 2>&1; then echo "warmup OK (${i}s)"; break; fi
              sleep 1
            done
            sleep 2
            echo "=== post-deploy smoke (로컬) ==="
            export SMOKE_BASE_URL=http://127.0.0.1:3000
            if ! node __tests__/nenovawebSmoke.test.js; then
              echo "❌ post-deploy smoke 실패 — pm2 logs 확인"
              pm2 logs nenova-erp --nostream --lines 20 2>&1
              exit 1
            fi
            # Production runs next start, so the recovery service has its own PM2 entry.
            if pm2 describe nenova-stock-recovery >/dev/null 2>&1; then
              NODE_ENV=production pm2 restart nenova-stock-recovery --update-env || exit 1
            else
              NODE_ENV=production pm2 start scripts/pending-stock-recovery-service.cjs --name nenova-stock-recovery --kill-timeout 10000 || exit 1
            fi
            pm2 save || exit 1
            node scripts/check-pending-stock-recovery-worker.cjs || exit 1
            echo "✅ 배포 완료"

      # 화면은 그려져도 React가 시동 안 되는 "조용한 장애" 감지 (2026-07-10 Turbopack 사고 재발 방지)
      # API 스모크는 이 유형을 못 잡는다 — Actions 러너의 실브라우저로 fiber 부착 여부를 직접 확인
      - name: Hydration smoke (실브라우저)
        run: |
          npm install puppeteer-core --no-save --no-audit --no-fund
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser)" \
            node scripts/hydration-smoke.js https://nenovaweb.com/login
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser)" \
            node scripts/week-pivot-hydration-smoke.js 'https://nenovaweb.com/shipment/week-pivot?popup=1'
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser)" \
            node scripts/layout-shell-smoke.js
