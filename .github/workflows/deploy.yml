name: Deploy to Cafe24
on:
  workflow_dispatch:
jobs:
  inspect-pnl-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only nginx upload routing evidence
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 172.233.89.171
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            nginx -T 2>&1 | awk '/^# configuration file / || /^[[:space:]]*(server_name|listen|location|client_max_body_size|proxy_read_timeout|proxy_send_timeout)[[:space:]]/ || /^[[:space:]]*proxy_pass[[:space:]]+http:\/\/(127\.0\.0\.1|localhost):[0-9]+;/ {print}'
