name: Pending recovery read-only runtime probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 172.233.89.171
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            export PATH=$PATH:/root/.nvm/versions/node/$(ls /root/.nvm/versions/node/ 2>/dev/null | tail -1)/bin:/usr/local/bin
            cd /var/www/nenova-erp
            pm2 jlist | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>console.log(JSON.stringify(JSON.parse(s).map(p=>({name:p.name,pid:p.pid,script:p.pm2_env.pm_exec_path,cwd:p.pm2_env.pm_cwd,nodeEnv:p.pm2_env.NODE_ENV,recovery:p.pm2_env.NENOVA_PENDING_STOCK_RECOVERY,directory:p.pm2_env.NENOVA_STOCK_RECOVERY_DIR})))));'
            node <<'NODE'
            const fs=require('fs');for(const name of ['heartbeat.json','status.json']){try{console.log(name,fs.readFileSync('/var/lib/nenova/stock-recovery/'+name,'utf8'));}catch(e){console.log(name,e.code);}}
            NODE
