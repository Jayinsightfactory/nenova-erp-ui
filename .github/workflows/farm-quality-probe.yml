name: Cafe24 read-only build diagnosis
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 172.233.89.171
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            free -m
            df -h /var/www/nenova-erp
            ps -eo pid,comm,rss --sort=-rss | head -12
            dmesg -T | grep -Ei 'out of memory|killed process|oom-kill' | tail -8
            stat -c '%y %n' /root/.pm2/logs/nenova-erp-error-0.log
            grep -B 8 -A 5 '883d22bb-6a9d-42f1-a9e0-e5e4b34993b7' /root/.pm2/logs/nenova-erp-error-0.log | tail -30
