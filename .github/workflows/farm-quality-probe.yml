name: Cafe24 remove task temporary build swap
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 172.233.89.171
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            set -eu
            target=/var/tmp/nenova-build-38336101010.swap
            test "$(readlink -f "$target")" = "$target"
            available=$(awk '/MemAvailable:/{print $2}' /proc/meminfo)
            used=$(swapon --show=NAME,USED --bytes --noheadings | awk -v t="$target" '$1==t{print int($2/1024)}')
            test -n "$used"
            test "$available" -gt "$((used+262144))"
            swapoff "$target"
            rm -- "$target"
            test ! -e "$target"
            free -m
