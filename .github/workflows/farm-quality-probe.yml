name: Farm quality read-only schema probe
on:
  pull_request:
    paths:
      - 'lib/farmQuality*'
      - 'docs/migrations/*farm_quality*'
      - '.github/workflows/farm-quality-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 172.233.89.171
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            cd /var/www/nenova-erp
            node --env-file=.env.local --input-type=module <<'NODE'
            import {query,getPool} from './lib/db.js';
            import * as quality from './lib/farmQuality.js';
            try {
              const columns=await query("SELECT c.name FROM sys.columns c WHERE c.object_id=OBJECT_ID(N'dbo.WebSalesDefectDeduction')");
              const names=new Set(columns.recordset.map(c=>c.name));
              const required=['DeductionKey','OrderYear','OrderWeek','CustName','ProdKey','ProdName','FarmKey','FarmName','SourceUnit','Quantity','OriginalQuantity','ImportConfirmed','IsDeleted','DeductionType'];
              const missing=required.filter(c=>!names.has(c));
              console.log(JSON.stringify({requiredColumns:required,missing}));
              if(missing.length)throw Error('Source schema incompatible');
              const result=await query("SELECT d.OrderYear,COUNT(*) SourceRows,SUM(CASE WHEN d.ImportConfirmed=1 AND ISNULL(d.IsDeleted,0)=0 AND d.FarmName<>N'' AND d.ProdKey>0 THEN 1 ELSE 0 END) EligibleRows FROM dbo.WebSalesDefectDeduction d LEFT JOIN Product p ON p.ProdKey=d.ProdKey WHERE d.OrderYear IN(2025,2026) AND d.DeductionType=N'불량차감' GROUP BY d.OrderYear");
              console.log(JSON.stringify({readOnly:true,aggregate:result.recordset}));
              const coverage=await query(`SELECT OrderYear,COUNT(*) SourceRows,
                SUM(CASE WHEN ISNULL(IsDeleted,0)=1 THEN 1 ELSE 0 END) DeletedRows,
                SUM(CASE WHEN ISNULL(IsDeleted,0)=0 THEN 1 ELSE 0 END) ActiveRows,
                SUM(CASE WHEN ISNULL(IsDeleted,0)=0 AND ISNULL(ImportConfirmed,0)=0 THEN 1 ELSE 0 END) ActiveUnconfirmed,
                SUM(CASE WHEN ISNULL(IsDeleted,0)=0 AND ISNULL(ProdKey,0)<=0 THEN 1 ELSE 0 END) ActiveMissingProduct,
                SUM(CASE WHEN ISNULL(IsDeleted,0)=0 AND LTRIM(RTRIM(ISNULL(FarmName,N'')))=N'' THEN 1 ELSE 0 END) ActiveMissingFarm,
                SUM(CASE WHEN ISNULL(IsDeleted,0)=0 AND ISNULL(OriginalQuantity,Quantity)<=0 THEN 1 ELSE 0 END) ActiveNonPositiveQuantity,
                SUM(CASE WHEN ISNULL(IsDeleted,0)=0 AND LTRIM(RTRIM(ISNULL(CustName,N'')))=N'' THEN 1 ELSE 0 END) ActiveMissingCustomerName
                FROM dbo.WebSalesDefectDeduction WHERE OrderYear IN(2025,2026) AND DeductionType=N'불량차감' GROUP BY OrderYear`);
              console.log(JSON.stringify({readOnly:true,coverage:coverage.recordset,reasonCountsOverlap:true}));
              const feedback=await query(`SELECT COUNT(*) CaseCount,
                SUM(CASE WHEN d.DeductionKey IS NULL THEN 1 ELSE 0 END) MissingAnchors
                FROM dbo.WebFarmQualityCase c LEFT JOIN dbo.WebSalesDefectDeduction d
                ON d.OrderYear=c.OrderYear AND d.DeductionKey=c.SourceKey`);
              const duplicates=await query(`SELECT COUNT(*) DuplicateAnchorGroups FROM
                (SELECT OrderYear,SourceKey FROM dbo.WebFarmQualityCase GROUP BY OrderYear,SourceKey HAVING COUNT(*)>1) d`);
              const schema=await query(`SELECT OBJECT_ID(N'dbo.WebFarmQualityInbox',N'U') InboxTable,
                OBJECT_ID(N'dbo.WebFarmQualityInboxSource',N'U') SourceLinkTable,
                COL_LENGTH(N'dbo.WebFarmQualityCase',N'InboxKey') CaseInboxColumn,
                COL_LENGTH(N'dbo.WebFarmQualityEvent',N'RequestEventKey') RequestEventColumn,
                HAS_PERMS_BY_NAME(N'dbo.WebFarmQualityEvent',N'OBJECT',N'ALTER') CanAlterEvent`);
              console.log(JSON.stringify({readOnly:true,feedback:feedback.recordset,duplicateAnchors:duplicates.recordset,inboxSchema:schema.recordset}));
              const target=await query(`SELECT d.DeductionKey,d.OrderYear,d.OrderWeek,d.CustName,d.ProdKey,d.ProdName,
                d.FarmKey,d.FarmName,f.FarmName MasterFarmName,d.SourceUnit,d.Quantity,d.OriginalQuantity,
                d.ImportConfirmed,d.ImportReviewRequired,d.Note,d.IsDeleted
                FROM dbo.WebSalesDefectDeduction d LEFT JOIN dbo.Farm f ON f.FarmKey=d.FarmKey
                WHERE d.OrderYear=2026 AND d.OrderWeek=N'38' AND d.DeductionType=N'불량차감'
                  AND d.CustName LIKE N'%날마다%' AND (d.ProdName LIKE N'%Blue%' OR d.ProdName LIKE N'%블루%' OR d.ProdKey IN
                    (SELECT p.ProdKey FROM Product p WHERE p.ProdName LIKE N'%Hydrangea Blue%' OR p.DisplayName LIKE N'%Blue%' OR p.DisplayName LIKE N'%블루%'))`);
              console.log(JSON.stringify({readOnly:true,targetRows:target.recordset}));
              if(target.recordset.length){
                const keys=target.recordset.map(r=>r.DeductionKey);
                const keyList=keys.map(Number).filter(Number.isSafeInteger).join(',');
                if(keyList){
                  const history=await query(`SELECT DeductionKey,ActionType,ChangeSummary,BeforeJson,AfterJson
                    FROM dbo.WebSalesDefectDeductionHistory WHERE DeductionKey IN (${keyList}) ORDER BY HistoryKey`);
                  console.log(JSON.stringify({readOnly:true,targetHistory:history.recordset}));
                }
                const candidates=await query(`SELECT d.DeductionKey,vw.OrderYear,vw.OrderWeek,vw.ProdKey,vw.FarmName,
                  f.FarmKey,SUM(ISNULL(vw.OutQuantity,0)) OutQuantity,COUNT_BIG(*) WarehouseRows
                  FROM dbo.WebSalesDefectDeduction d JOIN dbo.ViewWarehouse vw
                    ON vw.OrderYear=d.OrderYear AND (vw.OrderWeek=d.OrderWeek OR vw.OrderWeek LIKE d.OrderWeek+N'-%') AND vw.ProdKey=d.ProdKey
                  LEFT JOIN dbo.Farm f ON f.FarmName=vw.FarmName AND ISNULL(f.isDeleted,0)=0
                  WHERE d.DeductionKey IN (${keyList}) AND d.OrderYear=2026 AND d.OrderWeek=N'38'
                  GROUP BY d.DeductionKey,vw.OrderYear,vw.OrderWeek,vw.ProdKey,vw.FarmName,f.FarmKey ORDER BY vw.FarmName`);
                console.log(JSON.stringify({readOnly:true,sameWeekProductFarmCandidates:candidates.recordset}));
                const shippedFarm=await query(`SELECT d.DeductionKey,d.Quantity DefectQuantity,d.AppliedShipmentKey,
                  sm.OrderYear,sm.OrderWeek,sm.CustKey,sd.SdetailKey,sd.ProdKey,sf.FarmKey,f.FarmName,
                  sf.ShipmentQuantity
                  FROM dbo.WebSalesDefectDeduction d JOIN dbo.ShipmentMaster sm ON sm.ShipmentKey=d.AppliedShipmentKey
                  JOIN dbo.ShipmentDetail sd ON sd.ShipmentKey=sm.ShipmentKey AND sd.ProdKey=d.ProdKey
                  LEFT JOIN dbo.ShipmentFarm sf ON sf.SdetailKey=sd.SdetailKey
                  LEFT JOIN dbo.Farm f ON f.FarmKey=sf.FarmKey AND ISNULL(f.isDeleted,0)=0
                  WHERE d.DeductionKey IN (${keyList}) ORDER BY sm.ShipmentKey,sd.SdetailKey,sf.FarmKey`);
                console.log(JSON.stringify({readOnly:true,linkedShipmentFarmRows:shippedFarm.recordset}));
                const sameCustomerFarm=await query(`SELECT d.DeductionKey,sm.ShipmentKey,sm.OrderYear,sm.OrderWeek,sm.CustKey,
                  sd.SdetailKey,sd.ProdKey,sf.FarmKey,f.FarmName,sf.ShipmentQuantity
                  FROM dbo.WebSalesDefectDeduction d JOIN dbo.ShipmentMaster sm
                    ON sm.OrderYear=d.OrderYear AND (sm.OrderWeek=d.OrderWeek OR sm.OrderWeek LIKE d.OrderWeek+N'-%') AND sm.CustKey=d.CustKey
                  JOIN dbo.ShipmentDetail sd ON sd.ShipmentKey=sm.ShipmentKey AND sd.ProdKey=d.ProdKey
                  LEFT JOIN dbo.ShipmentFarm sf ON sf.SdetailKey=sd.SdetailKey
                  LEFT JOIN dbo.Farm f ON f.FarmKey=sf.FarmKey AND ISNULL(f.isDeleted,0)=0
                  WHERE d.DeductionKey IN (${keyList}) ORDER BY sm.ShipmentKey,sd.SdetailKey,sf.FarmKey`);
                console.log(JSON.stringify({readOnly:true,sameCustomerWeekProductFarms:sameCustomerFarm.recordset}));
              }
              if(typeof quality.qualitySignalCoverage==='function'){
                const source=await query(`SELECT DeductionKey,OrderYear,OrderWeek,CustKey,CustName,
                  ProdKey,ProdName,FarmKey,FarmName,SourceUnit,Quantity,OriginalQuantity,ImportConfirmed,IsDeleted
                  FROM dbo.WebSalesDefectDeduction WHERE OrderYear=2026 AND DeductionType=N'불량차감'`);
                const scope=quality.qualityScope({year:2026,from:1,to:53});
                const signals=quality.qualitySignals(source.recordset,scope);
                const byKind={};for(const signal of signals)byKind[signal.kind]=(byKind[signal.kind]||0)+1;
                console.log(JSON.stringify({readOnly:true,automatic:quality.qualitySignalCoverage(source.recordset,scope,signals),byKind}));
              }else console.log(JSON.stringify({readOnly:true,automaticVersion:'pre-all-source-signals'}));
            } finally {await (await getPool()).close();}
            NODE
