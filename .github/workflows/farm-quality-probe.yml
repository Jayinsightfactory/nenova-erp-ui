name: Cafe24 bounded temporary build swap
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 172.233.89.171
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            set -eu
            target=/var/tmp/nenova-build-38336101010.swap
            test ! -e "$target"
            test "$(df --output=avail -k /var/tmp | tail -1)" -gt 4194304
            install -m 600 /dev/null "$target"
            fallocate -l 2G "$target"
            mkswap "$target"
            swapon "$target"
            free -m
