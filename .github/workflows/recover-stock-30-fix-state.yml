name: Recover Stock 30 Fix State
on: workflow_dispatch
concurrency: {group: nenova-stock-30-repair, cancel-in-progress: false}
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: 172.233.89.171
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 30m
          script: |
            export PATH=$PATH:/root/.nvm/versions/node/$(ls /root/.nvm/versions/node/ 2>/dev/null | tail -1)/bin:/usr/local/bin
            cd /var/www/nenova-erp
            git fetch origin master && git reset --hard origin/master
            node --env-file=.env.local scripts/recover-stock-30-fix-state.mjs
