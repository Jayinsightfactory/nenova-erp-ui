name: Backfill Work-Drive Web Uploads

# 공개 실행 기록에는 웹 보관 원본과 업무 드라이브의 대조 건수만 남긴다.
# 실제 단건 복구는 비공개 유지보수 셸에서 검증된 SHA를 지정해 수행한다.
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit archived web uploads against the work drive
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 172.233.89.171
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 15m
          script: |
            set -e
            cd /var/www/nenova-erp
            if ! git merge-base --is-ancestor '${{ github.sha }}' HEAD || ! grep -Fq 'function auditArchives() {' scripts/work-drive-backfill-web-uploads.mjs; then
              echo 'The audited recovery script is not deployed.'
              exit 1
            fi
            node scripts/work-drive-backfill-web-uploads.mjs --audit
