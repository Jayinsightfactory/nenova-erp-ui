name: ERP Contract Guard

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: CI build artifact contracts
        run: node --test __tests__/ciBuildArtifact.test.cjs __tests__/codeOnlyDeployment.test.cjs
      - name: ERP contract manifests
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run test:erp-manifest -- --changed-from "$BASE_SHA"
      - name: Nenova dnSpy evidence guard
        run: npm run test:nenova-dnspy-evidence
      - name: Menu workflow guide videos
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          npm run test:workflow-guides
          node scripts/check-workflow-guides.cjs --changed-from "$BASE_SHA"
      - name: ERP behavior contracts
        run: npm run test:erp-contract
      - name: Automatic and manual defect registration parity
        run: node __tests__/salesDefectRegistrationProvenance.test.js
      - name: Desktop personal home contracts
        run: |
          node __tests__/desktopHomeWorkspace.test.cjs
          node --test __tests__/homeSourceLink.test.mjs
          node __tests__/distributionDeliveryStatus.test.js
          node __tests__/distributionDeliveryClient.test.js
          node __tests__/distributionSalesInbox.test.js
      - name: Canon link check (정본 연결 검사 — 형식만)
        run: npm run test:canon
      - name: PM sale-boundary guard (판매 예정 코드 ↔ 사내 전산 경계)
        run: npm run test:pm-boundary
      - name: PM office tests (UI kit raw-button guard)
        run: npm run test:pm
      - name: MOYI Drive integration contract
        run: npm run verify:moyi-drive-integration
      - name: Changed ERP write scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run guard:erp-writes -- --changed-from "$BASE_SHA"
      - name: Linux webpack build (pull request)
        if: github.event_name == 'pull_request'
        env:
          DB_SERVER: ''
          NEXT_DIST_DIR: .next-build
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm run build
          node scripts/ci-build-smoke.cjs
          node scripts/ci-build-manifest.cjs create "$GITHUB_SHA"
          node scripts/ci-build-manifest.cjs verify "$GITHUB_SHA"
