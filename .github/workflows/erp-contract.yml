name: ERP Contract Guard

on:
  pull_request:
  workflow_dispatch:

# Private 전환 대비 Actions 월 2,000분 한도 방어:
# - PR 연속 푸시 시 이전 실행 즉시 취소(cancel-in-progress: true)
# - master push에서는 deploy.yml이 동일한 ERP 계약·빌드 검증을 이미 수행하므로 중복 실행 제거
concurrency:
  group: erp-contract-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Approved stock procedure hash coverage (offline)
        run: node scripts/check-stock-procedure-hashes.cjs
      - name: Agent static guardrails (1s offline — BOM/SVG/Gothic/Anti-Slop)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          node --test __tests__/agentGuardrails.test.cjs
          npm run guard:agent-slop -- --changed-from "$BASE_SHA"
      - run: npm ci
      - name: CI build artifact contracts
        run: node --test __tests__/ciBuildArtifact.test.cjs __tests__/codeOnlyDeployment.test.cjs __tests__/privateRepoDeploy.test.cjs __tests__/desktopReleasesFeed.test.cjs
      - name: ERP contract manifests
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run test:erp-manifest -- --changed-from "$BASE_SHA"
      - name: Nenova dnSpy evidence guard
        run: npm run test:nenova-dnspy-evidence
      - name: Menu search concurrency and ranking
        run: node --test __tests__/productSearchCache.test.cjs __tests__/remoteSearchCancellation.test.cjs __tests__/productSearchWorker.test.js __tests__/useRankedProductSearch.test.js __tests__/mappingDbStore.test.js __tests__/productMasterUi.test.cjs __tests__/productCatalogUi.test.cjs __tests__/orderListPage.test.cjs
      - name: Menu workflow guide videos
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          npm run test:workflow-guides
          node scripts/check-workflow-guides.cjs --changed-from "$BASE_SHA"
      - name: ERP behavior contracts
        run: npm run test:erp-contract
      - name: Automatic and manual defect registration parity
        run: node __tests__/salesDefectRegistrationProvenance.test.js
      - name: Desktop personal home contracts
        run: |
          node __tests__/desktopHomeWorkspace.test.cjs
          node --test __tests__/homeSourceLink.test.mjs
          node __tests__/distributionDeliveryStatus.test.js
          node __tests__/distributionDeliveryClient.test.js
          node __tests__/distributionSalesInbox.test.js
      - name: Canon link check (정본 연결 검사 — 형식만)
        run: npm run test:canon
      - name: PM sale-boundary guard (판매 예정 코드 ↔ 사내 전산 경계)
        run: npm run test:pm-boundary
      - name: PM office tests (UI kit raw-button guard)
        run: npm run test:pm
      - name: MOYI Drive integration contract
        run: npm run verify:moyi-drive-integration
      - name: Changed ERP write scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run guard:erp-writes -- --changed-from "$BASE_SHA"
      - name: Linux webpack build (pull request)
        if: github.event_name == 'pull_request'
        env:
          DB_SERVER: ''
          NEXT_DIST_DIR: .next-build
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm run build
          node scripts/ci-build-smoke.cjs
          node scripts/ci-build-manifest.cjs create "$GITHUB_SHA"
          node scripts/ci-build-manifest.cjs verify "$GITHUB_SHA"
