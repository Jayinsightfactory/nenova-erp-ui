<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
<title>네노바 업무 메모장</title><link rel="stylesheet" href="./notes.css"><script src="./notes.js" defer></script></head>
<body><header><h1>오늘의 내 업무</h1><div class="header-actions"><button id="pin" type="button" aria-pressed="true">📌 맨 위 고정</button><button id="refresh" type="button">새로고침</button><button id="copy" type="button">목록 복사</button></div></header>
<main><div class="summary"><label>업무 날짜 <input id="date" type="date"></label><div class="progress"><span id="count"></span><div class="track"><div id="progressBar"></div></div></div></div>
<p id="status" role="status" aria-live="polite">업무를 불러오는 중…</p><p id="error" role="alert" hidden></p>
<div class="list-head"><h2>업무 목록</h2><span>저장 후 홈 화면과 동기화됩니다</span></div><div id="tasks"></div>
<form id="add"><h2>업무 추가</h2><label for="title">업무명 <span aria-hidden="true">*</span></label><input id="title" type="text" maxlength="300" required placeholder="업무명을 입력하세요">
<div class="repeat"><label>반복 설정 <select id="frequency"><option value="once">반복 없음</option><option value="daily">매일</option><option value="weekly">매주</option><option value="monthly">매월</option></select></label><fieldset id="days" hidden><legend>반복 요일</legend><label><input type="checkbox" value="1">월</label><label><input type="checkbox" value="2">화</label><label><input type="checkbox" value="3">수</label><label><input type="checkbox" value="4">목</label><label><input type="checkbox" value="5">금</label><label><input type="checkbox" value="6">토</label><label><input type="checkbox" value="0">일</label></fieldset><small id="monthHint" hidden>29~31일에 시작하면 짧은 달에는 말일에 표시됩니다.</small></div><button class="add-button" type="submit">＋ 추가</button></form>
<section class="reminder"><h2>화면 알림</h2><p>네노바 앱이 실행 중일 때, 미완료 업무가 있으면 하루 한 번 알립니다.</p><div><label>알림 시간 <input id="reminder" type="time"></label><button id="saveReminder" type="button">저장</button><button id="clearReminder" type="button">끄기</button></div></section>
</main></body></html>
