<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
<title>네노바 업무 메모장</title><link rel="stylesheet" href="./notes.css"><script src="./notes.js" defer></script></head>
<body><header><div class="brand"><span class="brand-mark">N</span><strong>네노바</strong><span>ERP</span></div>
<div class="hero"><div class="hero-icon" aria-hidden="true">✓</div><div class="hero-title"><h1>오늘의 내 업무</h1><span id="dateLabel"></span></div>
<div class="header-actions"><button id="pin" type="button" aria-label="맨 위 고정" aria-pressed="true" title="맨 위 고정">📌</button><button id="copy" type="button" aria-label="목록 복사" title="목록 복사">▣</button><button id="refresh" type="button" aria-label="새로고침" title="새로고침">↻</button></div></div></header>
<main><section class="summary" aria-label="업무 진행 현황"><div id="progressRing" class="progress-ring"><span id="ringCount">0 / 0</span><small>완료</small></div><div class="summary-body"><h2>오늘 업무 진행 현황</h2><span id="count">0 / 0 완료</span><div class="track"><div id="progressBar"></div></div><label class="date-control">업무 날짜 <input id="date" type="date"></label></div></section>
<p id="status" role="status" aria-live="polite">업무를 불러오는 중…</p><p id="error" role="alert" hidden></p>
<div class="list-head"><h2>업무 목록</h2><span>저장 후 홈과 동기화됩니다</span></div><div id="tasks"></div>
<form id="add"><h2><span class="section-icon" aria-hidden="true">＋</span> 업무 빠르게 추가</h2><label for="title">업무명 <span aria-hidden="true">*</span></label><input id="title" type="text" maxlength="300" required placeholder="추가할 업무 내용을 입력하세요">
<div class="repeat"><label>반복 설정 <select id="frequency"><option value="once">반복 없음</option><option value="daily">매일</option><option value="weekly">매주</option><option value="monthly">매월</option></select></label><fieldset id="days" hidden><legend>반복 요일</legend><label><input type="checkbox" value="1">월</label><label><input type="checkbox" value="2">화</label><label><input type="checkbox" value="3">수</label><label><input type="checkbox" value="4">목</label><label><input type="checkbox" value="5">금</label><label><input type="checkbox" value="6">토</label><label><input type="checkbox" value="0">일</label></fieldset><small id="monthHint" hidden>29~31일은 짧은 달의 말일에 표시됩니다.</small></div><button class="add-button" type="submit">＋ 업무 추가</button></form>
<section class="reminder"><h2><span class="bell" aria-hidden="true">♧</span> 화면 알림</h2><p>앱 실행 중 미완료 업무를 하루 한 번 알립니다.</p><div><label>알림 시간 <input id="reminder" type="time"></label><button id="saveReminder" type="button">저장</button><button id="clearReminder" type="button">끄기</button></div></section>
</main></body></html>
