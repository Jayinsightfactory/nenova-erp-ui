<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
<title>네노바 업무 메모장</title><link rel="stylesheet" href="./notes.css"><script src="./task-settings.js" defer></script><script src="./task-controls.js" defer></script><script src="./notes.js" defer></script></head>
<body><header><div class="top"><strong>오늘의 내 업무</strong><div class="header-actions"><button id="openHome" type="button" aria-label="메인 홈 열기" title="메인 홈 열기">↗</button><button id="pin" type="button" aria-label="맨 위 고정" aria-pressed="true">♧</button><button id="copy" type="button" aria-label="목록 복사">▣</button><button id="refresh" type="button" aria-label="새로고침">↻</button></div></div><div class="date-line"><input id="date" type="date" aria-label="업무 날짜"><span id="dateLabel"></span></div><div class="summary"><strong id="count">0 / 0 완료</strong><div class="track"><div id="progressBar"></div></div></div></header>
<main><p id="status" role="status" aria-live="polite"></p><p id="error" role="alert" hidden></p><div class="list-toolbar"><select id="filter" aria-label="업무 보기"><option value="all">전체 업무</option><option value="pending">남은 업무</option><option value="timeline">시간표</option></select><span>시간순 · 미정은 아래</span></div><div id="tasks"></div><button id="openAdd" type="button">＋ 업무 추가</button><details class="reminder"><summary>알림 설정</summary><p>앱 실행 중 미완료 업무를 하루 한 번 알립니다.</p><label>알림 시간 <input id="reminder" type="time"></label><button id="saveReminder" type="button">저장</button><button id="clearReminder" type="button">끄기</button></details><p class="standalone-hint">메인 창을 닫아도 메모장은 유지됩니다.</p><button id="quitApp" type="button">프로그램 완전 종료</button><a class="guide" href="https://nenovaweb.com/desktop-guide" id="guideLink">사용 가이드 영상 ↗</a></main>
<dialog id="editor"><form id="add"><div class="dialog-head"><h2 id="editorTitle">업무 추가</h2><button id="closeEditor" type="button" aria-label="편집 닫기">×</button></div><label>업무명<input id="title" type="text" maxlength="300" required placeholder="해야 할 일을 입력하세요"></label><label>시작 날짜<input id="startDate" type="date" required></label><label>반복 설정<select id="frequency"><option value="once">반복 없음</option><option value="daily">매일</option><option value="weekly">매주</option><option value="monthly">매월</option></select></label><fieldset id="days" hidden><legend>반복 요일</legend><label><input type="checkbox" value="1">월</label><label><input type="checkbox" value="2">화</label><label><input type="checkbox" value="3">수</label><label><input type="checkbox" value="4">목</label><label><input type="checkbox" value="5">금</label><label><input type="checkbox" value="6">토</label><label><input type="checkbox" value="0">일</label></fieldset><small id="monthHint" hidden>29~31일은 짧은 달의 말일에 표시됩니다.</small><div id="settings"></div><p id="editError" role="alert" hidden></p><small>선택한 업무는 즉시, 반복 설정은 다음날부터 반영됩니다.</small><div class="dialog-foot"><button id="cancelEditor" type="button">취소</button><button class="add-button" type="submit">저장</button></div></form></dialog>
</body></html>
